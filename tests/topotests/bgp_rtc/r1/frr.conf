interface eth-sw
 ip address 10.0.1.10/24
!
router bgp 65000
  bgp router-id 10.0.1.10
  neighbor 10.0.1.100 remote-as 65000
  address-family l2vpn evpn
   neighbor 10.0.1.100 activate
   advertise-all-vni
  exit-address-family
  address-family ipv4 rt-constraint
   neighbor 10.0.1.100 activate
   rt 65000:400/96
  exit-address-family
  !
!

