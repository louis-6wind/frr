// debug bgp update-groups
debug bgp updates in
debug bgp updates out
// debug bgp neighbor-events
!
interface lo
 ip address 192.168.0.1/32
!
interface eth-rr1
 ip address 10.0.1.1/24
!
interface eth-ce1
 ip address 172.16.1.1/24
!
interface eth-ce2
 ip address 172.16.2.1/24
!
router bgp 65000
  bgp router-id 192.168.0.1
  no bgp default ipv4-unicast
  neighbor 192.168.0.100 remote-as 65000
  neighbor 192.168.0.100 update-source 192.168.0.1
!
 address-family ipv4 unicast
   no neighbor 192.168.0.100 activate
  exit-address-family
!
  address-family ipv4 vpn
   neighbor 192.168.0.100 activate
   neighbor 192.168.0.100 soft-reconfiguration inbound
  exit-address-family
!
  address-family ipv4 rt-constraint
   neighbor 192.168.0.100 activate
   rt 65000:100/96
   rt 65000:101/96
  exit-address-family
  !
!
router bgp 65000 vrf RED
 bgp router-id 192.168.0.1
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export 100
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 192.168.0.1
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export 101
  rd vpn export 65000:101
  rt vpn both 65000:101
  export vpn
  import vpn
 exit-address-family
exit
!
interface lo
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
interface eth-rr1
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
router isis 1
 lsp-gen-interval 2
 net 10.0000.0000.0000.0000.0000.0000.0000.0000.0001.00
 metric-style wide
 exit
!
mpls ldp
 router-id 192.168.0.1
 !
 address-family ipv4
  discovery transport-address 192.168.0.1
  !
  interface eth-rr1
  !
 !
!