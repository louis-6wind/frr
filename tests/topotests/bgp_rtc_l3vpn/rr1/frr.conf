debug bgp update-groups
debug bgp updates in
debug bgp updates out
debug bgp neighbor-events
!
int lo
 ip address 192.168.0.100/32
!
interface eth-pe1
 ip address 10.0.1.100/24
!
interface eth-pe2
 ip address 10.0.2.100/24
!
router bgp 65000
  bgp router-id 192.168.0.100
  bgp cluster-id 192.168.0.100
  bgp log-neighbor-changes
  no bgp default ipv4-unicast
  neighbor PE peer-group
  neighbor PE remote-as 65000
  neighbor PE update-source 192.168.0.100
  bgp listen range 192.168.0.0/24 peer-group PE
!
  address-family ipv4 unicast
   no neighbor PE activate
  exit-address-family
!
  address-family ipv4 vpn
   neighbor PE activate
   neighbor PE route-reflector-client
  exit-address-family
!
  address-family ipv4 rt-constraint
   neighbor PE activate
   neighbor PE route-reflector-client
   rt 65000:100/96
   rt 65000:101/96
   rt 65000:102/96
  exit-address-family
!
interface lo
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
interface eth-pe1
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
interface eth-pe2
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
router isis 1
 lsp-gen-interval 2
 net 10.0000.0000.0000.0000.0000.0000.0000.0000.0100.00
 metric-style wide
 exit
!
mpls ldp
 router-id 192.168.0.100
 !
 address-family ipv4
  discovery transport-address 192.168.0.100
  !
  interface eth-pe1
  exit
  !
  interface eth-pe2
  !
 !
!