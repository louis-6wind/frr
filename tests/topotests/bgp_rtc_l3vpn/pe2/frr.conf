debug bgp updates in
debug bgp updates out
!
interface lo
 ip address 192.168.0.2/32
!
interface eth-rr1
 ip address 10.0.2.1/24
!
interface eth-ce3
 ip address 172.16.3.1/24
!
interface eth-ce4
 ip address 172.16.4.1/24
!
router bgp 65000
  bgp router-id 192.168.0.2
  no bgp default ipv4-unicast
  neighbor 192.168.0.100 remote-as 65000
  neighbor 192.168.0.100 update-source 192.168.0.2
!
 address-family ipv4 unicast
   no neighbor 192.168.0.100 activate
  exit-address-family
!
  address-family ipv4 vpn
   neighbor 192.168.0.100 activate
   neighbor 192.168.0.100 soft-reconfiguration inbound
  exit-address-family
!
  address-family ipv4 rt-constraint
   neighbor 192.168.0.100 activate
   rt 65000:100/96
   rt 65000:102/96
  exit-address-family
  !
router bgp 65000 vrf RED
 bgp router-id 192.168.0.2
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export 100
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf GREEN
 bgp router-id 192.168.0.2
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export 102
  rd vpn export 65000:102
  rt vpn both 65000:102
  export vpn
  import vpn
 exit-address-family
exit
!
interface lo
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
interface eth-rr1
 ip router isis 1
 isis hello-interval 2
 ipv6 router isis 1
!
router isis 1
 lsp-gen-interval 2
 net 10.0000.0000.0000.0000.0000.0000.0000.0000.0002.00
 metric-style wide
