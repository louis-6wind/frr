hostname r2
!
interface lo
 ip address 192.168.0.2/32
 ip router isis AA
 isis passive
exit
!
interface eth-r1
 isis circuit-type level-1
 ip address 10.0.1.2/24
 ip router isis AA
 isis hello-multiplier 10
 isis network point-to-point
exit
!
interface eth-r3
 isis circuit-type level-2-only
 ip address 10.0.2.2/24
 ip router isis AA
 isis hello-multiplier 10
 isis network point-to-point
exit
!
route-map ACCEPT_ALL permit 1
exit
!
router isis AA
 net 49.0002.0000.0000.2222.00
 net 49.0001.0000.0000.2222.00
 redistribute ipv4 isis level-1 into level-2 route-map ACCEPT_ALL metric 200
 redistribute ipv4 isis level-2 into level-1 route-map ACCEPT_ALL metric 200
exit
