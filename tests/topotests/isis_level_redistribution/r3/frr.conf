hostname r3
!
interface lo
 ip address 192.168.0.3/32
 ip router isis AA
 isis passive
exit
!
interface eth-r2
 ip address 10.0.2.3/24
 ip router isis AA
 isis circuit-type level-2-only
 isis hello-multiplier 10
 isis network point-to-point
exit
!
interface eth-r4
 ip address 10.0.3.3/24
 ip router isis AA
 isis circuit-type level-2-only
 isis hello-multiplier 10
 isis network point-to-point
exit
!
router isis AA
 is-type level-2-only
 net 49.0001.0000.0000.3333.00
exit
